version: "3.8"

services:
  postgres:
    image: "postgres:latest"
    container_name: managing-travel-tours
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - managing_travel_tours_postgres:/var/lib/postgresql/data

volumes:
  managing_travel_tours_postgres: