databaseChangeLog:
  - changeSet:
      id: Create Travelers table
      author: shahin.agasiyev
      changes:
        - createTable:
            tableName: travelers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR
                  constraints:
                    nullable: false
#add addUniqueConstraint for email columns