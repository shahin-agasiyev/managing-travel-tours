databaseChangeLog:
  - changeSet:
      id: Create Passports table
      author: shahin.agasiyev
      changes:
        - createTable:
            tableName: passports
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: passport_number
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: issue_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: guide_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: passports
            baseColumnNames: guide_id
            referencedTableName: guides
            referencedColumnNames: id
            constraintName: fk_passports_guide_id
        - addUniqueConstraint:
            tableName: passports
            columnNames: guide_id
            constraintName: unique_guide_passport
        - addUniqueConstraint:
            tableName: passports
            columnNames: passport_number
            constraintName: unique_passport_number
